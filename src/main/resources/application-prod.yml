server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

logging:
  level:
    com.margaretnjoki.miniblog: INFO
    root: WARN