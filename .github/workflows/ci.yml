name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mini_blog_db
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: 6878
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mini_blog_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mini_blog_db
          SPRING_DATASOURCE_USERNAME: dev_user
          SPRING_DATASOURCE_PASSWORD: 6878
        run: ./mvnw clean test